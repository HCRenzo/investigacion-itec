<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda ITEC</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-session="client">
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/tienda"><span class="logo">▲</span> Tienda ITEC</a>
    <nav id="nav"></nav>
    <div class="topbar-right" id="userbox"></div>
  </header>
  <main id="app" class="container"></main>

  <aside id="cart" class="cart" aria-label="Carrito" hidden>
    <div class="cart-head"><h2>Tu carrito</h2><button class="icon-btn" id="cart-close" aria-label="Cerrar">✕</button></div>
    <div id="cart-body" class="cart-body"></div>
    <div id="cart-foot" class="cart-foot"></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/common.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
