<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modulo de ventas</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="sales-app">
    <header>
      <p class="eyebrow">Punto de venta</p>
      <h1>Nuevas ventas</h1>
      <span id="status" class="status">API disponible</span>
    </header>

    <section class="composer">
      <label>Cliente
        <input id="customer" value="Cliente general" maxlength="120">
      </label>
      <div class="line-editor">
        <label>Producto
          <select id="product">
            <option value="P-001">Cuaderno - $12.50</option>
            <option value="P-002">Lapicera - $3.75</option>
            <option value="P-003">Resma A4 - $8.90</option>
            <option value="P-004">Mochila - $29.99</option>
          </select>
        </label>
        <label>Cantidad
          <input id="quantity" type="number" min="1" value="1">
        </label>
        <button id="add" type="button" aria-label="Agregar producto">+</button>
      </div>
    </section>

    <section class="line-list">
      <h2>Articulos</h2>
      <div id="lines"></div>
    </section>

    <fieldset class="mode">
      <legend>Modo de proceso</legend>
      <label><input type="radio" name="mode" value="fast" checked> Optimizado</label>
      <label><input type="radio" name="mode" value="slow"> Simulacion lenta (30 s)</label>
    </fieldset>
    <button id="checkout" class="checkout" type="button">Generar recibo</button>

    <section id="receipt" class="receipt" hidden aria-live="polite"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
