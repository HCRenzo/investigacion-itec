name: Dependencias

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main", "release" ]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (librerias vulnerables)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Auditar requirements.txt
        run: pip-audit -r requirements.txt

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # necesario para publicar el comentario en el PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always   # comentario en el PR con el resumen por severidad
          # GitHub no tiene la licencia registrada para estas acciones (aparece "Unknown License"),
          # pero todas son MIT: se permiten explicitamente.
          allow-dependencies-licenses: >-
            pkg:githubactions/actions/checkout,
            pkg:githubactions/actions/setup-python,
            pkg:githubactions/actions/dependency-review-action,
            pkg:githubactions/github/codeql-action,
            pkg:pypi/pytest
