name: Dependencias

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main", "release" ]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (librerias vulnerables)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # --no-deps/--disable-pip: solo compara las versiones fijadas contra la base de vulnerabilidades
      - name: Auditar requirements.txt
        run: pip-audit -r requirements.txt
      - name: Auditar demo/requirements.txt (prueba)
        if: always()
        run: pip-audit -r demo/requirements.txt --no-deps --disable-pip

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # necesario para publicar el comentario en el PR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: always   # comentario en el PR con el resumen por severidad
